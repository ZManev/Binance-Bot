name: arbitrage-fullbot-simulation
on:
  push:
    branches:
      - "feature/arbitrum-flashloan-simulation"
      - "integration/**"
  pull_request:
    paths:
      - "arbitrage/**"
      - "dashboard/**"
      - "tests/test_arbitrage_*.py"
      - "requirements-arbitrage.txt"
      - ".github/workflows/arbitrage-fullbot.yml"
permissions:
  contents: read
jobs:
  fullbot-simulation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulation API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-arbitrage.txt
      - name: Run arbitrage simulation and API tests
        run: python -m pytest tests/test_arbitrage_fullbot.py tests/test_arbitrage_*.py -q
