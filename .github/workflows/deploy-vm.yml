name: deploy-production-vm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        run: docker build -t trading-platform:${{ github.sha }} .
      - name: Export image
        run: docker save trading-platform:${{ github.sha }} | gzip > trading-platform.tar.gz
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Transfer image
        env:
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: scp trading-platform.tar.gz "$USER@$HOST:/tmp/trading-platform.tar.gz"
      - name: Deploy container
        env:
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
          API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          SIGNING_SECRET: ${{ secrets.APPROVAL_SIGNING_SECRET }}
          EXCHANGE_ID: ${{ vars.EXCHANGE_ID }}
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
        run: |
          # Secrets travel over SSH stdin only; nothing is written to disk on the runner.
          {
            printf 'EXCHANGE_API_KEY=%s\n' "$API_KEY"
            printf 'EXCHANGE_API_SECRET=%s\n' "$API_SECRET"
            printf 'APPROVAL_SIGNING_SECRET=%s\n' "$SIGNING_SECRET"
            printf 'EXCHANGE_ID=%s\n' "$EXCHANGE_ID"
            printf 'LIVE_TRADING=%s\n' "$LIVE_TRADING"
            printf 'PORT=8080\n'
          } | ssh "$USER@$HOST" 'set -eu
            umask 077
            d=$(mktemp -d)
            trap "rm -rf \"$d\"" EXIT
            cat > "$d/env"
            docker load < /tmp/trading-platform.tar.gz
            rm -f /tmp/trading-platform.tar.gz
            docker rm -f trading-platform 2>/dev/null || true
            docker volume create trading-state >/dev/null
            docker run -d --name trading-platform --restart unless-stopped -p 127.0.0.1:8080:8080 -v trading-state:/var/lib/trading --env-file "$d/env" trading-platform:${{ github.sha }}'
      - name: Health check
        env:
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh "$USER@$HOST" 'curl --fail --silent --show-error http://127.0.0.1:8080/readyz'; then
              exit 0
            fi
            sleep 2
          done
          ssh "$USER@$HOST" 'docker logs --tail 100 trading-platform'
          exit 1
