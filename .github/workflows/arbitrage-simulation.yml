name: arbitrage-simulation

on:
  push:
    branches:
      - "feature/arbitrum-flashloan-simulation"
      - "integration/**"
  pull_request:
    paths:
      - "arbitrage/**"
      - "tests/arbitrage/**"
      - ".github/workflows/arbitrage-simulation.yml"

permissions:
  contents: read

jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run offline simulation tests
        run: python -m pytest tests/arbitrage -q
