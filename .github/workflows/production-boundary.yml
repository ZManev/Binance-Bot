name: production-boundary

on:
  push:
    branches:
      - main
      - "integration/**"
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest ccxt
      - name: Run production boundary tests
        run: python -m pytest -q production_bot
