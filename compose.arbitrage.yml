services:
  arbitrage-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.arbitrage
    container_name: ai-flashloan-arbitrage-simulation
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      EXECUTION_MODE: SIMULATION
      LIVE_TRADING: "false"
      ALLOW_TRANSACTION_SUBMISSION: "false"
      ALLOW_CONTRACT_DEPLOYMENT: "false"
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      AAVE_V3_ADDRESSES_PROVIDER: ${AAVE_V3_ADDRESSES_PROVIDER:-}
    restart: unless-stopped
